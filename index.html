/* ============ AUDIO ============ */
let AC=null,master=null,muted=false,musicTimer=null,nextT=0,stepI=0;
function audioInit(){
  if(AC){ if(AC.state==='suspended') AC.resume(); return; }
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext; if(!Ctx) return;
    AC=new Ctx(); master=AC.createGain(); master.gain.value=.55; master.connect(AC.destination); startMusic();
  }catch(e){ AC=null; }
}
function tone(freq,dur,type,vol,slide,delay){
  if(!AC||muted) return;
  try{
    const t=AC.currentTime+(delay||0); const o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(freq,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),t+dur);
    g.gain.setValueAtTime(vol||.1,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.03);
  }catch(e){}
}
const SFX={
  slash(){tone(320,.1,'sawtooth',.07,-200);},
  hit(){tone(170,.12,'square',.12,-110);},
  shoot(){tone(760,.15,'square',.09,-560);},
  hurt(){tone(230,.3,'sawtooth',.14,-160);},
  pick(){tone(660,.07,'square',.09);tone(880,.1,'square',.09,0,.07);},
  join(){[523,659,784,1046].forEach((f,i)=>tone(f,.13,'square',.09,0,i*.09));},
  blip(){tone(500+Math.random()*80,.03,'square',.035);},
  alert(){tone(900,.08,'square',.05);},
  fall(){tone(440,.5,'triangle',.14,-330);},
  click(){tone(140,.04,'square',.06);},

const mtof=n=>440*Math.pow(2,(n-69)/12);

  if(musicTimer||!AC) return;
  nextT=AC.currentTime+.1;

    if(!AC) return;

  const r=pad.getBoundingClientRect(), max=r.width/2;

  const nx=dx/max, ny=dy/max, m=Math.hypot(nx,ny)||1, k=Math.min(1,m);
  knob.style.transform='translate('+(nx/m*k*max*.55)+'px,'+(ny/m*k*max*.55)+'px)';
  setKey('left',nx<-.3); setKey('right',nx>.3); setKey('up',ny<-.3); setKey('down',ny>.3);

function padEnd(){ padId=null; knob.style.transform=''; setKey('left',false); setKey('right',false); setKey('up',false); setKey('down',false); }

pad.addEventListener('pointerup',e=>{ if(e.pointerId===padId) padEnd(); });

function chaseNext(c){
  const sx=Math.floor(c.x/T), sy=Math.floor(c.y/T), tx=Math.floor(P.x/T), ty=Math.floor(P.y/T);

  while(q.length&&!found){ const [x,y]=q.shift();
    for(const d of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx=x+d[0], ny=y+d[1]; if(nx<0||ny<0||nx>=MW||ny>=MH||prev.has(key(nx,ny))) continue; if(solid(nx*T+8,ny*T+8)) continue; prev.set(key(nx,ny),[x,y]); if(nx===tx&&ny===ty){ found=true; break; } q.push([nx,ny]); } }
  if(!found) return null;
  let c2=[tx,ty], p=prev.get(key(tx,ty)); while(p&&!(p[0]===sx&&p[1]===sy)){ c2=p; p=prev.get(key(p[0],p[1])); }
  return [c2[0]*T+8,c2[1]*T+8];
}
function chaseStep(list,sp,m1,m2,smart){

  const done=S5IDS.every(id=>G.killed.has(id));
  if(done){
    G.gate2Open=true; saveGame();
    if(G.scr===5) startDialog([['','Los soldados abandonan la barricada de carretas. La calle queda libre.']]); else toast('LA BARRICADA DE TIJUANA SE ABRIÓ');
  }
}
function useStrike(){
  if(G.mode!=='play') return;
  if(!G.allies.length){ toast('NECESITAS COMPAÑEROS'); SFX.click(); return; }
  if(G.meter<100){ toast('HUELGA GENERAL: '+Math.floor(G.meter)+'%'); SFX.click(); return; }
  G.meter=0; G.strikeT=240; G.shake=12; G.wave={t:0,x:P.x,y:P.y};
  enemies.forEach(e=>{ if(Math.abs(e.x-P.x)<W&&Math.abs(e.y-P.y)<PH) e.stun=e.type==='boss'?150:240; });
  toast('¡HUELGA GENERAL!'); SFX.win();
}
function startCard(pages,next,lastLabel){ E={i:0,pages,next:next||null,lastLabel:lastLabel||null}; G.mode='end'; }

}

function updPlayer(){
  if(pressed.spc) useStrike();
  if(P.inv>0) P.inv--; if(P.shootCd>0) P.shootCd--;
  let dx=(keys.right?1:0)-(keys.left?1:0), dy=(keys.down?1:0)-(keys.up?1:0);
  const sp=P.atkT>0?.6:1.35; P.moving=false; P.mvx=0; P.mvy=0;
  if(dx||dy){
    const l=Math.hypot(dx,dy); dx/=l; dy/=l;
    if(Math.abs(dx)>Math.abs(dy)+.01) P.dir=dx>0?'right':'left';
    else if(Math.abs(dy)>Math.abs(dx)+.01) P.dir=dy>0?'down':'up';
    else if(P.dir==='up'||P.dir==='down') P.dir=dx>0?'right':'left'; else P.dir=dy>0?'down':'up';
    P.mvx=dx*sp; P.mvy=dy*sp; const ox=P.x,oy=P.y; moveEnt(P,dx*sp,dy*sp,5,5);
    if(P.x!==ox||P.y!==oy){ P.moving=true; P.anim++; if(P.anim%7===0) parts.push({x:P.x+(Math.random()-.5)*4,y:P.y+7,vx:(Math.random()-.5)*.3,vy:-.12,life:18,col:'rgba(190,170,130,.7)',sz:2,fade:true}); P.trail.push({x:P.x,y:P.y}); if(P.trail.length>120) P.trail.shift(); }
  }
  if(P.kx||P.ky){ moveEnt(P,P.kx,P.ky,5,5); P.kx*=.8; P.ky*=.8; if(Math.abs(P.kx)<.1)P.kx=0; if(Math.abs(P.ky)<.1)P.ky=0; }
  // machete
  const useHeld=keys.atk||(keys.ctx&&!G.ctxLock&&(!G.ctxArm||G.ctxDown>=14));
  const useEdge=pressed.atk||(pressed.ctx&&!G.ctxArm&&!G.ctxLock)||(keys.ctx&&G.ctxArm&&G.ctxDown===14&&!G.ctxLock);
  if(G.equip==='machete'){ if(useHeld&&P.hasMachete&&P.atkT<=0){ P.atkMax=macheteStats().cd; P.atkT=P.atkMax; P.hitSet=new Set(); SFX.slash(); } }
  else if(G.equip==='carabina'){ if(useHeld) fireRifle(); }
  else if(G.equip==='venda'){ if(useEdge) useVenda(); }
  else if(G.equip==='huelga'){ if(useEdge) useStrike(); }
  if(P.atkT>0){
    const ms=macheteStats();
    if(P.atkT<=(P.atkMax||18)-3&&P.atkT>=5){
      const v=DIRV[P.dir], cx=P.x+v[0]*ms.reach, cy=P.y+v[1]*ms.reach;
      enemies.slice().forEach(e=>{ if(!P.hitSet.has(e)&&overlap(e,cx,cy,ms.r)){ P.hitSet.add(e); damageEnemy(e,ms.dmg,e.x-P.x,e.y-P.y,'m'); } });
    }
    P.atkT--;
  }
  // carabina (atajo de teclado X)
  if(pressed.shoot) fireRifle();
}
function macheteStats(){ return [{dmg:1,cd:18,reach:14,r:9},{dmg:1,cd:14,reach:16,r:10},{dmg:2,cd:14,reach:18,r:11}][(G.macheteLv||1)-1]; }
function rifleStats(){ return [{dmg:2,cd:32,spd:4,life:70,pierce:0},{dmg:2,cd:20,spd:4.3,life:75,pierce:0},{dmg:3,cd:28,spd:5.4,life:110,pierce:1}][(G.rifleLv||1)-1]; }
function fireRifle(){
  if(!P.hasRifle||P.shootCd>0) return;
  if(P.ammo>0){ const v=DIRV[P.dir]; const rs=rifleStats(); P.ammo--; P.shootCd=rs.cd; SFX.shoot(); bullets.push({x:P.x+v[0]*8,y:P.y+v[1]*8,vx:v[0]*rs.spd,vy:v[1]*rs.spd,from:'p',dmg:rs.dmg,life:rs.life,pierce:rs.pierce,lv:G.rifleLv}); muzzle(P.x+v[0]*13,P.y+v[1]*13); parts.push({x:P.x,y:P.y,vx:-v[0]*.5+(Math.random()-.5)*.8,vy:-1.1,life:22,col:'#d8b43a',sz:1,fade:true}); G.shake=Math.max(G.shake,1); saveGame(); }
  else { toast('SIN BALAS'); SFX.click(); P.shootCd=20; }
}
function useVenda(){
  if(G.vendas<=0) return;
  if(P.hp>=P.maxhp){ toast('YA TIENES LA VIDA COMPLETA'); SFX.click(); return; }
  G.vendas--; P.hp=Math.min(P.maxhp,P.hp+2); SFX.pick(); toast('VENDA: +2 CORAZONES'); G.stripT=100; saveGame();
}
function updAllies(){
  G.allies.forEach((a,i)=>{
    const idx=Math.max(0,P.trail.length-1-(i+1)*9), tg=P.trail[idx];
    const ox=a.x,oy=a.y; a.x+=(tg.x-a.x)*.2; a.y+=(tg.y-a.y)*.2;
    const mx=a.x-ox,my=a.y-oy; a.moving=Math.hypot(mx,my)>.12; if(a.moving){ a.anim++; if(Math.abs(mx)>Math.abs(my)) a.dir=mx>0?'right':'left'; else a.dir=my>0?'down':'up'; }
    if(a.kind.kind==='support'){ if(--a.cd<=0){ if(P.hp<P.maxhp){ P.hp++; toast(a.name.toUpperCase()+' TE CURÓ'); SFX.pick(); a.cd=a.kind.cd*(G.mercy>=3?.7:1); } else a.cd=120; } return; }
    if(a.cd>0){ a.cd-=(G.strikeT>0?2:1); return; }
    let best=null,bd=1e9;
    enemies.forEach(e=>{ if(e.type==='boss'&&!e.active) return; if(e.shaken||e.state==='flee') return; const d=Math.hypot(e.x-a.x,e.y-a.y); if(d<bd){ bd=d; best=e; } });
    if(best&&bd<a.kind.range){
      a.cd=a.kind.cd;
      if(a.kind.kind==='melee'){ damageEnemy(best,a.kind.dmg,best.x-a.x,best.y-a.y,'m'); burst(best.x,best.y,'#fff',4); }
      else { const l=bd||1; bullets.push({x:a.x,y:a.y,vx:(best.x-a.x)/l*3.4,vy:(best.y-a.y)/l*3.4,from:'a',dmg:a.kind.dmg,life:60}); SFX.shoot(); }
    }
  });
}
function walk(e,vx,vy,keep){
  moveEnt(e,vx,vy,5,5); e.x=clamp(e.x,6,WW-6); e.y=clamp(e.y,6,WH-6);
  if(!keep){ if(Math.abs(vx)>Math.abs(vy)) e.dir=vx>0?'right':'left'; else e.dir=vy>0?'down':'up'; }
  e.moving=true; e.anim++;
}
function updMg(e,dx,dy,d){
  const D=G.diff;
  e.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');
  if(d>150){ e.lt=0; return; }
  if(e.lt>0){
    e.timer--;
    if(e.timer<=0){ e.timer=8; e.lt--; SFX.shoot(); const a=Math.atan2(P.y-e.y,P.x-e.x); bullets.push({x:e.x,y:e.y,vx:Math.cos(a)*2.6,vy:Math.sin(a)*2.6,from:'e',dmg:1,life:120}); muzzle(e.x+Math.cos(a)*12,e.y+1+Math.sin(a)*12); if(e.lt===0) e.cd=[200,150,110][D]; }
  } else if(e.cd<=0){
    if(e.alertT===1){ e.lt=3; e.timer=0; }
    else if(e.alertT<=0){ e.alertT=24; SFX.alert(); }
  }
}
function sightBlocked(x1,y1,x2,y2){
  const d=Math.hypot(x2-x1,y2-y1), n=Math.ceil(d/6);
  for(let i=1;i<n;i++){ const x=x1+(x2-x1)*i/n, y=y1+(y2-y1)*i/n, tx=Math.floor(x/T), ty=Math.floor(y/T);
    if(tx<0||ty<0||tx>=MW||ty>=MH) return true;
    const c=MAP[ty][tx];
    if(c==='#') return true;
    if(c==='g'&&!G.opened.has('crack:'+tx+','+ty)) return true;
    if(c==='L'&&!G.opened.has('lock'+scrAt(tx,ty))) return true;
    if(c==='X'&&!(scrAt(tx,ty)===5?G.gate2Open:G.gateOpen)) return true; }
  return false;
}
function alertNear(e){ enemies.forEach(o=>{ if(o!==e&&o.type!=='boss'&&o.state==='patrol'&&!o.shaken&&Math.hypot(o.x-e.x,o.y-e.y)<110&&!sightBlocked(o.x,o.y,e.x,e.y)){ o.state='chase'; o.alertT=30; } }); }
function updEnemy(e){
  if(e.type==='celador'){ updCelador(e); return; }
  if(e.hurtT>0) e.hurtT--; if(e.cd>0) e.cd--; if(e.alertT>0) e.alertT--; if(e.exposeT>0) e.exposeT--;
  e.moving=false;
  if(e.kx||e.ky){ moveEnt(e,e.kx,e.ky,5,5); e.x=clamp(e.x,6,WW-6); e.y=clamp(e.y,6,WH-6); e.kx*=.8; e.ky*=.8; if(Math.abs(e.kx)<.1)e.kx=0; if(Math.abs(e.ky)<.1)e.ky=0; }
  const dx=P.x-e.x, dy=P.y-e.y, d=Math.hypot(dx,dy)||1;
  if(e.state==='flee'){
    e.fleeT--; walk(e,-dx/d*1.1,-dy/d*1.1);
    if(e.fleeT<=0||(e.blocked&&e.fleeT<80)){ enemies=enemies.filter(x=>x!==e); G.killed.add(e.id); saveGame(); checkGate2(); }
    return;
  }
  if(e.stun>0){ e.stun--; e.lunge=0; return; }
  if(e.shaken){ e.shakenT=(e.shakenT||0)+1; return; }
  if(e.type==='mg'){ updMg(e,dx,dy,d); return; }
  if(e.state==='patrol'){
    e.timer--;
    if(e.timer<=0||!e.tx){ e.tx=e.area[0]+Math.random()*(e.area[2]-e.area[0]); e.ty=e.area[1]+Math.random()*(e.area[3]-e.area[1]); e.timer=150+Math.random()*100; }
    const tx=e.tx-e.x, ty=e.ty-e.y, td=Math.hypot(tx,ty);
    if(td>3) walk(e,tx/td*.45,ty/td*.45);
    if(d<72&&!sightBlocked(e.x,e.y,P.x,P.y)){ e.state='chase'; e.alertT=40; SFX.alert(); alertNear(e); }
  } else {
    if(d>140){ e.state='patrol'; e.tx=0; e.lunge=0; return; }
    if(e.lunge!==2){ if(sightBlocked(e.x,e.y,P.x,P.y)){ e.noSee=(e.noSee||0)+1; if(e.noSee>150){ e.state='patrol'; e.tx=0; e.lunge=0; e.noSee=0; return; } } else e.noSee=0; }
    const D=G.diff;
    if(e.type==='tirador'){
      if(d<55) walk(e,-dx/d*.5,-dy/d*.5); else if(d>85) walk(e,dx/d*.5,dy/d*.5);
      if(Math.abs(dx)>Math.abs(dy)) e.dir=dx>0?'right':'left'; else e.dir=dy>0?'down':'up';
      if(e.cd<=0&&d<130&&!sightBlocked(e.x,e.y,P.x,P.y)){
        e.cd=[150,115,90][D]*(G.flags.ch2?.9:1); SFX.shoot();
        const lead=[0,10,16][D], ax=P.x+(P.mvx||0)*lead-e.x, ay=P.y+(P.mvy||0)*lead-e.y, al=Math.hypot(ax,ay)||1, sp=[1.5,1.9,2.2][D]+(G.flags.ch2?.4:0);
        bullets.push({x:e.x,y:e.y,vx:ax/al*sp,vy:ay/al*sp,from:'e',dmg:1,life:140}); muzzle(e.x+ax/al*8,e.y+ay/al*8);
      }
    } else {
      const guard=e.type==='guardia';
      if(guard&&e.stagT>0){ e.stagT--; return; }
      if(guard){ if(e.turnT>0) e.turnT--; else { e.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'); e.turnT=[95,75,55][D]; } }
      if(e.lunge===1){
        e.lt--; if(e.lt<=0){ for(let i=0;i<6;i++) parts.push({x:e.x+(Math.random()-.5)*8,y:e.y+6,vx:(Math.random()-.5)*1.2,vy:-Math.random()*.6,life:16,col:'rgba(190,170,130,.75)',sz:2,fade:true}); e.lunge=2; e.lt=guard?12:14; const sp=guard?1.6:2.5; e.lvx=dx/d*sp; e.lvy=dy/d*sp; }
      } else if(e.lunge===2){
        e.lt--; walk(e,e.lvx,e.lvy,guard); if(d<12) hurtPlayer(e);
        if(e.lt<=0||e.blocked){ e.lunge=0; e.lcd=[90,70,50][D]; if(guard){ e.exposeT=[110,72,48][D]; e.stagT=[45,30,20][D]; } }
      } else {
        walk(e,dx/d*(guard?.5:.75),dy/d*(guard?.5:.75),guard);
        if(d<(guard?12:11)) hurtPlayer(e);
        if(e.lcd>0) e.lcd--;
        if(d<44&&e.lcd<=0){ e.lunge=1; e.lt=[30,22,16][D]; e.alertT=e.lt; SFX.alert(); }
      }
    }
  }
}
function updBoss(b){
  if(b.hurtT>0) b.hurtT--; if(!b.active) return;
  if(b.stun>0){ b.stun--; b.moving=false; return; }
  b.t++; b.moving=false;
  const dx=P.x-b.x, dy=P.y-b.y, d=Math.hypot(dx,dy)||1, cor=b.kind==='coronel', fast=b.hp<=b.maxhp/2;
  if(b.st!=='charge'){ if(Math.abs(dx)>Math.abs(dy)) b.dir=dx>0?'right':'left'; else b.dir=dy>0?'down':'up'; }
  if(d<16) hurtPlayer(b);
  switch(b.st){
    case 'idle':
      b.timer--; b.moving=true; b.anim++; moveEnt(b,dx/d*.35,dy/d*.35,9,9);
      if(b.timer<=0){
        if(Math.random()<(cor?.3:.5)){ b.st='tele'; b.timer=fast?30:42; SFX.alert(); }
        else { b.st='volley'; b.timer=0; b.volleys=(cor?3:2)+(fast?1:0); }
      }
      break;
    case 'tele':
      b.timer--; if(b.timer<=0){ b.st='charge'; b.timer=48; b.vx=dx/d*(fast?3:2.5); b.vy=dy/d*(fast?3:2.5); }
      break;
    case 'charge':
      b.timer--; b.moving=true; b.anim+=2; moveEnt(b,b.vx,b.vy,9,9);
      if(b.blocked||b.timer<=0){ b.st='recover'; b.timer=fast?40:60; burst(b.x,b.y,'#c9a46a',8); }
      break;
    case 'volley':
      if(b.timer<=0){
        b.volleys--; SFX.shoot(); const base=Math.atan2(dy,dx), n=cor?1:2;
        for(let k=-n;k<=n;k++){ const a=base+k*.28; bullets.push({x:b.x,y:b.y,vx:Math.cos(a)*1.7,vy:Math.sin(a)*1.7,from:'e',dmg:1,life:200}); }
        b.timer=34;
        if(b.volleys<=0){ b.st='recover'; b.timer=fast?30:50; }
      } else b.timer--;
      break;
    case 'call':
      b.timer--;
      if(b.timer===25){
        toast(cor?'¡GUARDIAS!':'¡RURALES!'); SFX.alert();
        (cor?[['b2g1','guardia'],['b2g2','guardia']]:[['bossr1','rural'],['bossr2','rural']]).forEach((q,k)=>{ if(!G.killed.has(q[0])) enemies.push(makeEnemy({id:q[0],type:q[1],x:b.ox+(k?216:40),y:b.oy+96,area:[b.ox+24,b.oy+40,b.ox+232,b.oy+184]})); });
      }
      if(b.timer<=0){ b.st='recover'; b.timer=20; }
      break;
    case 'recover':
      b.timer--; if(b.timer<=0){ b.st='idle'; b.timer=fast?35:60; }
      break;
  }
  b.x=clamp(b.x,b.ox+12,b.ox+W-12); b.y=clamp(b.y,b.oy+14,b.oy+PH-14);
}
function breakCrack(tx,ty){
  const st=[[tx,ty]], seen=new Set(); let n=0;
  while(st.length){ const q=st.pop(), k=q[0]+','+q[1]; if(seen.has(k)) continue; seen.add(k);
    if((MAP[q[1]]||'')[q[0]]!=='g'||G.opened.has('crack:'+k)) continue;
    G.opened.add('crack:'+k); n++; burst(q[0]*T+8,q[1]*T+8,'#b9a47a',10);
    st.push([q[0]+1,q[1]],[q[0]-1,q[1]],[q[0],q[1]+1],[q[0],q[1]-1]); }
  if(n){ buildBG(); G.shake=Math.max(G.shake,7); SFX.fall(); toast('EL MURO SE ROMPIÓ'); saveGame(); }
}
function crackHint(){
  if(G.flags.tut_g||!P.hasRifle||G.t%20) return;
  const tx=Math.floor(P.x/T), ty=Math.floor(P.y/T);
  for(let dy=-2;dy<=2;dy++) for(let dx=-2;dx<=2;dx++){ if((MAP[ty+dy]||'')[tx+dx]==='g'&&!G.opened.has('crack:'+(tx+dx)+','+(ty+dy))){ G.flags.tut_g=true; startDialog([['CONSEJO','Un muro agrietado. Una bala de carabina lo rompe y puede esconder algo. Dispárale desde lejos.']]); saveGame(); return; } }
}
function updBullets(){

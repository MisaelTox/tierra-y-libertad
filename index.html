/* ============ AUDIO ============ */
let AC=null,master=null,muted=false,musicTimer=null,nextT=0,stepI=0;
function audioInit(){
  if(AC){ if(AC.state==='suspended') AC.resume(); return; }
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext; if(!Ctx) return;
    AC=new Ctx(); master=AC.createGain(); master.gain.value=.55; master.connect(AC.destination); startMusic();
  }catch(e){ AC=null; }
}
function tone(freq,dur,type,vol,slide,delay){
  if(!AC||muted) return;
  try{
    const t=AC.currentTime+(delay||0); const o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(freq,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),t+dur);
    g.gain.setValueAtTime(vol||.1,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.03);
  }catch(e){}
}
const SFX={
  slash(){tone(320,.1,'sawtooth',.07,-200);},
  hit(){tone(170,.12,'square',.12,-110);},
  shoot(){tone(760,.15,'square',.09,-560);},
  hurt(){tone(230,.3,'sawtooth',.14,-160);},
  pick(){tone(660,.07,'square',.09);tone(880,.1,'square',.09,0,.07);},
  join(){[523,659,784,1046].forEach((f,i)=>tone(f,.13,'square',.09,0,i*.09));},
  blip(){tone(500+Math.random()*80,.03,'square',.035);},
  alert(){tone(900,.08,'square',.05);},
  fall(){tone(440,.5,'triangle',.14,-330);},
  click(){tone(140,.04,'square',.06);},

  if(musicTimer||!AC) return;

    if(!AC) return;

  const r=pad.getBoundingClientRect(), max=r.width/2;

  const nx=dx/max, ny=dy/max, m=Math.hypot(nx,ny)||1, k=Math.min(1,m);
  knob.style.transform='translate('+(nx/m*k*max*.55)+'px,'+(ny/m*k*max*.55)+'px)';

function padEnd(){ padId=null; knob.style.transform=''; setKey('left',false); setKey('right',false); setKey('up',false); setKey('down',false); }

pad.addEventListener('pointerup',e=>{ if(e.pointerId===padId) padEnd(); });

function chaseNext(c){
  const sx=Math.floor(c.x/T), sy=Math.floor(c.y/T), tx=Math.floor(P.x/T), ty=Math.floor(P.y/T);
  if(sx===tx&&sy===ty) return null;
  const prev=new Map(), key=(x,y)=>x*1000+y, q=[[sx,sy]]; prev.set(key(sx,sy),null); let found=false;
  while(q.length&&!found){ const [x,y]=q.shift();
    for(const d of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx=x+d[0], ny=y+d[1]; if(nx<0||ny<0||nx>=MW||ny>=MH||prev.has(key(nx,ny))) continue; if(solid(nx*T+8,ny*T+8)) continue; prev.set(key(nx,ny),[x,y]); if(nx===tx&&ny===ty){ found=true; break; } q.push([nx,ny]); } }
  if(!found) return null;
  let c2=[tx,ty], p=prev.get(key(tx,ty)); while(p&&!(p[0]===sx&&p[1]===sy)){ c2=p; p=prev.get(key(p[0],p[1])); }
  return [c2[0]*T+8,c2[1]*T+8];
}
function chaseStep(list,sp,m1,m2,smart){
  list.forEach(c=>{
    let dx=P.x-c.x, dy=P.y-c.y, d=Math.hypot(dx,dy)||1; c.a=(c.a||0)+1;
    if(smart&&d>14){ if(!c.nx||c.a%10===0) c.nx=chaseNext(c); if(c.nx){ const ex=c.nx[0]-c.x, ey=c.nx[1]-c.y, ed=Math.hypot(ex,ey); if(ed>1){ dx=ex; dy=ey; } else dx=P.x-c.x, dy=P.y-c.y; } }
    const dd=Math.hypot(dx,dy)||1, mx=dx/dd*sp, my=dy/dd*sp;
    if(!boxHit(c.x+mx,c.y,5,5)) c.x+=mx; if(!boxHit(c.x,c.y+my,5,5)) c.y+=my;
    c.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');
    if(G.mode==='play'&&Math.hypot(P.x-c.x,P.y-c.y)<11) ushCaught(m1,m2);
  });
}

function edgeOK(a,b){
  if((a===1&&b===9)||(a===9&&b===1)) return G.opened.has('lock1')||G.items.has('llaveAduana');
  if(a===9&&b===11) return G.opened.has('rejaTaller');
  if(a===11&&b===9) return true;
  if((a===2&&b===3)||(a===3&&b===2)) return G.opened.has('lock2')||G.items.has('llaveJefatura');
  if(a===5&&b===16) return G.opened.has('rejaTijuana');
  if(a===16&&b===5) return true;
  if((a===16&&b===17)||(a===17&&b===16)) return G.opened.has('lock16')||G.items.has('llaveTelegrafo');
  if((a===0&&b===18)||(a===18&&b===0)) return G.opened.has('water:canal0');
  if(G.ep==='ushuaia'&&((a===32&&b===33)||(a===33&&b===32))) return !!G.gateOpen;
  if(G.ep&&((a===25&&b===26)||(a===26&&b===25))) return !!G.gateOpen;
  if((a===1&&b===2)||(a===2&&b===1)) return G.gateOpen;
  if((a===5&&b===6)||(a===6&&b===5)) return G.gate2Open;
  return true;
}
function guideDir(targets){
  if(!targets||targets.includes(G.scr)) return null;
  const q=[[G.scr,null]], seen=new Set([G.scr]);
  while(q.length){
    const it=q.shift(), a=it[0], first=it[1], ex=SCREENS[a].exits;
    for(const dir in ex){ const b=ex[dir]; if(seen.has(b)||!edgeOK(a,b)) continue; seen.add(b); const f=first||dir; if(targets.includes(b)) return f; q.push([b,f]); }
  }
  return null;
}
function leverAt(){
  for(const k in LEVERS){ const i=+k; if(!WORLD||SCREENS[i].ch!==WORLD.ch) continue; const o=scrOrigin(i);
    for(const L of LEVERS[k]){ const wx=o.x+L.x*T+8, wy=o.y+L.y*T+8; if(Math.hypot(wx-P.x,wy-P.y)<26) return Object.assign({},L,{wx:wx,wy:wy}); } }
  return null;
}
function pullLever(L){
  const key='water:'+L.g;
  if(G.opened.has(key)){ toast('YA ESTÁ ACCIONADA'); SFX.click(); return; }
  G.opened.add(key); SFX.join(); G.shake=6; buildBG(); toast(LEVER_MSG[L.g]||'SE ABRE LA COMPUERTA'); saveGame();
  for(let k=0;k<12;k++) parts.push({x:L.wx,y:L.wy,vx:(Math.random()-.5)*1.6,vy:-Math.random()*1.4,life:22,col:'#8fc4e8',sz:2,fade:true});
}
function interactTarget(){
  if(G.ep==='ushuaia'&&!G.gateOpen&&gateNear(32)) return 'gate';
  if(leverAt()) return 'lever';
  for(const n of npcs){ if(Math.hypot(n.x-P.x,n.y-P.y)<28) return 'npc'; }
  for(const e of enemies){ if(e.shaken&&Math.hypot(e.x-P.x,e.y-P.y)<26) return 'shaken'; }
  for(const q of PRESS){ if(Math.hypot(q.x-P.x,q.y-P.y)<28) return 'press'; }
  if(!G.gateOpen&&gateNear(1)) return 'gate';
  if(!G.gate2Open&&gateNear(5)) return 'gate';
  return null;
}

let lockMsgT=0;
function checkLocks(){
  const px=Math.floor(P.x/T), py=Math.floor(P.y/T);
  for(let ty=Math.max(0,py-2);ty<=Math.min(MH-1,py+2);ty++) for(let tx=Math.max(0,px-2);tx<=Math.min(MW-1,px+2);tx++){
    const c=MAP[ty][tx]; if(c!=='L'&&c!=='R') continue;
    const cx=tx*T+8, cy=ty*T+8; if(Math.abs(P.x-cx)>15||Math.abs(P.y-cy)>15) continue;
    const sc=scrAt(tx,ty);
    if(c==='L'&&!G.opened.has('lock'+sc)){
      const L=LOCKS[sc];
      if(G.items.has(L.item)){ G.opened.add('lock'+sc); SFX.join(); toast('PUERTA ABIERTA'); G.shake=4; buildBG(); saveGame(); return; }
      if(G.t>lockMsgT){ toast('NECESITAS: '+L.name); SFX.click(); lockMsgT=G.t+150; }
    } else if(c==='R'&&!(REJAS[sc]&&G.opened.has(REJAS[sc].id))){
      const R=REJAS[sc], f=R&&R.from;
      const side=(f==='right'&&P.x>cx)||(f==='left'&&P.x<cx)||(f==='up'&&P.y<cy)||(f==='down'&&P.y>cy);
      if(f&&side){ G.opened.add(R.id); SFX.join(); toast('¡ATAJO ABIERTO!'); G.shake=6; buildBG(); saveGame(); return; }
      if(G.t>lockMsgT){ toast('LA REJA ESTÁ TRABADA DEL OTRO LADO'); SFX.click(); lockMsgT=G.t+150; }
    }
  }
}

function fitPages(pages){

    pg.b.forEach(par=>{
      let lines=wrap(par,214);

        if(room<=0||(lines.length>room&&lines.length<=10&&cur.b.length>0)){ start(); room=10; }
        const take=lines.slice(0,room); lines=lines.slice(room);

        if(lines.length) start();

    });
  });

}

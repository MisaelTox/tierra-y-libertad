/* ============ AUDIO ============ */
let AC=null,master=null,muted=false,musicTimer=null,nextT=0,stepI=0;
function audioInit(){
  if(AC){ if(AC.state==='suspended') AC.resume(); return; }
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext; if(!Ctx) return;
    AC=new Ctx(); master=AC.createGain(); master.gain.value=.55; master.connect(AC.destination); startMusic();
  }catch(e){ AC=null; }
}
function tone(freq,dur,type,vol,slide,delay){
  if(!AC||muted) return;
  try{
    const t=AC.currentTime+(delay||0); const o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(freq,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),t+dur);
    g.gain.setValueAtTime(vol||.1,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.03);
  }catch(e){}
}
const SFX={
  slash(){tone(320,.1,'sawtooth',.07,-200);},
  hit(){tone(170,.12,'square',.12,-110);},
  shoot(){tone(760,.15,'square',.09,-560);},
  hurt(){tone(230,.3,'sawtooth',.14,-160);},
  pick(){tone(660,.07,'square',.09);tone(880,.1,'square',.09,0,.07);},
  join(){[523,659,784,1046].forEach((f,i)=>tone(f,.13,'square',.09,0,i*.09));},
  blip(){tone(500+Math.random()*80,.03,'square',.035);},
  alert(){tone(900,.08,'square',.05);},
  fall(){tone(440,.5,'triangle',.14,-330);},
  click(){tone(140,.04,'square',.06);},
  win(){[392,523,659,784,1046].forEach((f,i)=>tone(f,.2,'square',.1,0,i*.12));}

const LEAD=[64,0,62,60,57,0,60,0,62,0,60,58,57,0,0,0, 64,0,65,64,62,0,60,0,58,0,60,62,57,0,0,0];

const BPM=104, STEP=60/BPM/2;
const mtof=n=>440*Math.pow(2,(n-69)/12);
function startMusic(){
  if(musicTimer||!AC) return;
  nextT=AC.currentTime+.1;
  musicTimer=setInterval(()=>{
    if(!AC) return;
    while(nextT<AC.currentTime+.25){
      const i=stepI%32, d=nextT-AC.currentTime;
      if(LEAD[i]) tone(mtof(LEAD[i]),STEP*1.6,'square',.022,0,d);
      if(BASS[i]) tone(mtof(BASS[i]),STEP*1.8,'triangle',.07,0,d);
      if(i%4===0) tone(110,.09,'sine',.09,-60,d);
      stepI++; nextT+=STEP;
    }
  },80);
}

const pad=document.getElementById('pad'),knob=document.getElementById('knob'); let padId=null;
function padMove(e){
  const r=pad.getBoundingClientRect(), max=r.width/2;
  const dx=e.clientX-(r.left+max), dy=e.clientY-(r.top+max);
  const nx=dx/max, ny=dy/max, m=Math.hypot(nx,ny)||1, k=Math.min(1,m);
  knob.style.transform='translate('+(nx/m*k*max*.55)+'px,'+(ny/m*k*max*.55)+'px)';
  setKey('left',nx<-.3); setKey('right',nx>.3); setKey('up',ny<-.3); setKey('down',ny>.3);
}
function padEnd(){ padId=null; knob.style.transform=''; setKey('left',false); setKey('right',false); setKey('up',false); setKey('down',false); }
pad.addEventListener('pointerdown',e=>{ e.preventDefault(); padId=e.pointerId; try{pad.setPointerCapture(e.pointerId);}catch(_){} audioInit(); padMove(e); });
pad.addEventListener('pointermove',e=>{ if(e.pointerId===padId) padMove(e); });
pad.addEventListener('pointerup',e=>{ if(e.pointerId===padId) padEnd(); });
pad.addEventListener('pointercancel',e=>{ if(e.pointerId===padId) padEnd(); });
function toCanvas(e){
  const r=cv.getBoundingClientRect(), s=Math.min(r.width/W,r.height/H);
  return {x:(e.clientX-r.left-(r.width-W*s)/2)/s, y:(e.clientY-r.top-(r.height-H*s)/2)/s};
}

/* ============ DIALOGO ============ */
function wrap(text,maxW){
  const words=text.split(' '),out=[]; let cur='';
  for(const w of words){ const t=cur?cur+' '+w:w; if(ctx.measureText(t).width>maxW&&cur){ out.push(cur); cur=w; } else cur=t; }
  if(cur) out.push(cur); return out;
}
function startDialog(lines,onEnd){
  ctx.font='8px '+FONT; D.pages=[];
  lines.forEach(l=>{ const who=l[0],lw=wrap(l[1],(who&&colFor(who))?176:222); for(let k=0;k<lw.length;k+=3) D.pages.push({who,lines:lw.slice(k,k+3)}); });
  D.i=0; D.shown=0; D.onEnd=onEnd||null; G.mode='dialog';
}
function updDialog(){
  const pg=D.pages[D.i], total=pg.lines.join('').length;
  if(D.shown<total){ D.shown++; if(D.shown%3===0) SFX.blip(); }
  if(pressed.act||pressed.atk){
    if(D.shown<total) D.shown=total;
    else{
      D.i++; D.shown=0;
      if(D.i>=D.pages.length){ G.mode='play'; const f=D.onEnd; D.onEnd=null; if(f) f(); }
    }
  }
}

/* ============ COLISIONES ============ */
function solid(px,py){
  const tx=Math.floor(px/T), ty=Math.floor(py/T);
  if(tx<0||tx>=COLS||ty<0||ty>=ROWS) return false;
  const c=MAP[ty][tx]; return SOLID.has(c)||(c==='X'&&!gateOpenHere());
}
function gateOpenHere(){ return G.scr===5?G.gate2Open:G.gateOpen; }
function boxHit(x,y,hw,hh){ return solid(x-hw,y-hh)||solid(x+hw-1,y-hh)||solid(x-hw,y+hh-1)||solid(x+hw-1,y+hh-1); }
function npcBlock(x,y){ for(const n of npcs) if(Math.abs(n.x-x)<9&&Math.abs(n.y-y)<8) return true; return false; }
function moveEnt(e,dx,dy,hw,hh){
  hw=hw||5; hh=hh||5; e.blocked=false;
  if(dx){ const nx=e.x+dx; if(!boxHit(nx,e.y,hw,hh)&&!(e===P&&npcBlock(nx,e.y))) e.x=nx; else e.blocked=true; }
  if(dy){ const ny=e.y+dy; if(!boxHit(e.x,ny,hw,hh)&&!(e===P&&npcBlock(e.x,ny))) e.y=ny; else e.blocked=true; }
}

/* ============ EFECTOS ============ */
function burst(x,y,col,n){ for(let i=0;i<n;i++){ const a=Math.random()*6.28,s=.5+Math.random()*1.6; parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:18+Math.random()*14,col}); } }

/* ============ JUGADOR ============ */
function hurtPlayer(src){
  if(P.inv>0||G.mode!=='play') return;
  const sx=P.x-src.x, sy=P.y-src.y, l=Math.hypot(sx,sy)||1;
  P.kx=sx/l*3; P.ky=sy/l*3; G.shake=8;
  if(G.allies.length){
    const a=G.allies.pop(); P.inv=80; SFX.fall(); burst(a.x,a.y,'#c8312b',12); toast(a.name.toUpperCase()+' CAYÓ POR TI');
  } else {
    P.hp--; P.inv=70; SFX.hurt(); burst(P.x,P.y,'#c8312b',8);
    if(P.hp<=0){ P.hp=0; G.mode='over'; SFX.fall(); }
  }
}
function overlap(e,cx,cy,r){ const m=e.type==='boss'?11:6; return Math.abs(e.x-cx)<r+m&&Math.abs(e.y-cy)<r+m; }
function addMeter(n){ const o=G.meter; G.meter=Math.min(100,G.meter+n); if(o<100&&G.meter>=100&&G.allies.length) toast('¡HUELGA GENERAL LISTA!'); }
function isShielded(e,sx,sy){
  const sh=e.shield||(e.type==='boss'&&e.kind==='coronel'&&(e.st==='idle'||e.st==='volley'||e.st==='tele'));
  if(!sh||e.stun>0||e.shaken) return false;
  const v=DIRV[e.dir], l=Math.hypot(sx,sy)||1;
  return (v[0]*(-sx)+v[1]*(-sy))/l>.45;
}
function damageEnemy(e,dmg,sx,sy,src){
  if(e.type==='boss'&&e.hurtT>0) return false;
  if(e.state==='flee') return false;
  const l=Math.hypot(sx,sy)||1;
  if(src==='m'&&isShielded(e,sx,sy)){
    SFX.click(); G.shake=Math.max(G.shake,2); burst(e.x-sx/l*8,e.y-sy/l*8,'#dfe6ee',5);
    if(e.type!=='boss'){ e.kx=sx/l*1.2; e.ky=sy/l*1.2; if(e.state==='patrol') e.state='chase'; }
    if(!G.flags.shieldTip){ G.flags.shieldTip=true; toast('EL ESCUDO BLOQUEA: ATACA DE LADO O POR ATRÁS'); }
    return false;
  }
  if(e.stun>0) dmg*=2;
  e.hp-=dmg; e.hurtT=e.type==='boss'?16:10; SFX.hit(); G.shake=Math.max(G.shake,3); burst(e.x,e.y,'#f2ead3',5);
  addMeter(e.type==='boss'?4:6);
  if(e.type!=='boss'){
    e.kx=sx/l*3; e.ky=sy/l*3; if(e.state==='patrol') e.state='chase';
    if(e.hp===1&&!e.shaken){ e.shaken=true; e.state='shaken'; if(P.copies>0) toast('SE RINDE: DALE UN EJEMPLAR'); }
  } else if(e.kind==='coronel'){
    G.boss2Hp=e.hp; if(!G.boss2Called&&e.hp<=9&&e.hp>0){ G.boss2Called=true; e.st='call'; e.timer=50; }
  } else {
    G.bossHp=e.hp; if(!G.bossCalled&&e.hp<=7&&e.hp>0){ G.bossCalled=true; e.st='call'; e.timer=50; }
  }
  if(e.hp<=0) killEnemy(e);
  return true;
}
function killEnemy(e){
  enemies=enemies.filter(x=>x!==e); G.killed.add(e.id); burst(e.x,e.y,'#d8c35a',14); SFX.fall();
  if(e.type==='boss'){ bossDown(e); return; }
  if(Math.random()<.4){
    if(P.hp<P.maxhp&&Math.random()<.6) pickups.push({type:'heart',x:e.x,y:e.y});
    else if(P.hasRifle) pickups.push({type:'ammo',x:e.x,y:e.y});
  }
  checkGate2(); saveGame();
}
function convince(e){
  e.shaken=false; e.state='flee'; e.fleeT=110; G.deserters++; if(G.flags.ch2) G.des2++; addMeter(25);
  SFX.join(); toast('SE PASA A NUESTRO LADO'); burst(e.x,e.y,'#f2ead3',8);
  if(P.hp<P.maxhp&&Math.random()<.5) pickups.push({type:'heart',x:e.x,y:e.y});

const S5IDS=['s5r1','s5r2','s5g1','s5g2','s5t1'];

function updPlayer(){
  if(pressed.spc) useStrike();
  if(P.inv>0) P.inv--; if(P.shootCd>0) P.shootCd--;
  let dx=(keys.right?1:0)-(keys.left?1:0), dy=(keys.down?1:0)-(keys.up?1:0);
  const sp=P.atkT>0?.9:1.35; P.moving=false;
  if(dx||dy){
    const l=Math.hypot(dx,dy); dx/=l; dy/=l;
    if(Math.abs(dx)>Math.abs(dy)+.01) P.dir=dx>0?'right':'left';
    else if(Math.abs(dy)>Math.abs(dx)+.01) P.dir=dy>0?'down':'up';
    else if(P.dir==='up'||P.dir==='down') P.dir=dx>0?'right':'left'; else P.dir=dy>0?'down':'up';
    const ox=P.x,oy=P.y; moveEnt(P,dx*sp,dy*sp,5,5);
    if(P.x!==ox||P.y!==oy){ P.moving=true; P.anim++; if(P.anim%7===0) parts.push({x:P.x+(Math.random()-.5)*4,y:P.y+7,vx:(Math.random()-.5)*.3,vy:-.12,life:18,col:'rgba(190,170,130,.7)',sz:2,fade:true}); P.trail.push({x:P.x,y:P.y}); if(P.trail.length>120) P.trail.shift(); }
  }
  if(P.kx||P.ky){ moveEnt(P,P.kx,P.ky,5,5); P.kx*=.8; P.ky*=.8; if(Math.abs(P.kx)<.1)P.kx=0; if(Math.abs(P.ky)<.1)P.ky=0; }
  // machete
  if(keys.atk&&P.hasMachete&&P.atkT<=0){ P.atkT=14; P.hitSet=new Set(); SFX.slash(); }
  if(P.atkT>0){
    if(P.atkT<=12&&P.atkT>=4){
      const v=DIRV[P.dir], cx=P.x+v[0]*14, cy=P.y+v[1]*14;
      enemies.slice().forEach(e=>{ if(!P.hitSet.has(e)&&overlap(e,cx,cy,9)){ P.hitSet.add(e); damageEnemy(e,1,e.x-P.x,e.y-P.y,'m'); } });
    }
    P.atkT--;
  }
  // carabina
  if(pressed.shoot&&P.hasRifle&&P.shootCd<=0){
    if(P.ammo>0){ const v=DIRV[P.dir]; P.ammo--; P.shootCd=20; SFX.shoot(); bullets.push({x:P.x+v[0]*8,y:P.y+v[1]*8,vx:v[0]*4,vy:v[1]*4,from:'p',dmg:2,life:70}); saveGame(); }
    else { toast('SIN BALAS'); SFX.click(); P.shootCd=20; }
  }
}
function updAllies(){
  G.allies.forEach((a,i)=>{
    const idx=Math.max(0,P.trail.length-1-(i+1)*9), tg=P.trail[idx];
    const ox=a.x,oy=a.y; a.x+=(tg.x-a.x)*.2; a.y+=(tg.y-a.y)*.2;
    const mx=a.x-ox,my=a.y-oy; a.moving=Math.hypot(mx,my)>.12; if(a.moving){ a.anim++; if(Math.abs(mx)>Math.abs(my)) a.dir=mx>0?'right':'left'; else a.dir=my>0?'down':'up'; }
    if(a.kind.kind==='support'){ if(--a.cd<=0){ if(P.hp<P.maxhp){ P.hp++; toast(a.name.toUpperCase()+' TE CURÓ'); SFX.pick(); a.cd=a.kind.cd; } else a.cd=120; } return; }
    if(a.cd>0){ a.cd-=(G.strikeT>0?2:1); return; }
    let best=null,bd=1e9;
    enemies.forEach(e=>{ if(e.type==='boss'&&!e.active) return; if(e.shaken||e.state==='flee') return; const d=Math.hypot(e.x-a.x,e.y-a.y); if(d<bd){ bd=d; best=e; } });
    if(best&&bd<a.kind.range){
      a.cd=a.kind.cd;
      if(a.kind.kind==='melee'){ damageEnemy(best,a.kind.dmg,best.x-a.x,best.y-a.y,'m'); burst(best.x,best.y,'#fff',4); }
      else { const l=bd||1; bullets.push({x:a.x,y:a.y,vx:(best.x-a.x)/l*3.4,vy:(best.y-a.y)/l*3.4,from:'a',dmg:a.kind.dmg,life:60}); SFX.shoot(); }
    }
  });
}
function walk(e,vx,vy,keep){
  moveEnt(e,vx,vy,5,5); e.x=clamp(e.x,6,W-6); e.y=clamp(e.y,6,PH-6);
  if(!keep){ if(Math.abs(vx)>Math.abs(vy)) e.dir=vx>0?'right':'left'; else e.dir=vy>0?'down':'up'; }
  e.moving=true; e.anim++;
}
function updEnemy(e){
  if(e.hurtT>0) e.hurtT--; if(e.cd>0) e.cd--; if(e.alertT>0) e.alertT--;
  e.moving=false;
  if(e.kx||e.ky){ moveEnt(e,e.kx,e.ky,5,5); e.x=clamp(e.x,6,W-6); e.y=clamp(e.y,6,PH-6); e.kx*=.8; e.ky*=.8; if(Math.abs(e.kx)<.1)e.kx=0; if(Math.abs(e.ky)<.1)e.ky=0; }
  const dx=P.x-e.x, dy=P.y-e.y, d=Math.hypot(dx,dy)||1;
  if(e.state==='flee'){
    e.fleeT--; walk(e,-dx/d*1.1,-dy/d*1.1);
    if(e.fleeT<=0||(e.blocked&&e.fleeT<80)){ enemies=enemies.filter(x=>x!==e); G.killed.add(e.id); saveGame(); checkGate2(); }
    return;
  }
  if(e.stun>0){ e.stun--; return; }
  if(e.shaken) return;
  if(e.state==='patrol'){
    e.timer--;
    if(e.timer<=0||!e.tx){ e.tx=e.area[0]+Math.random()*(e.area[2]-e.area[0]); e.ty=e.area[1]+Math.random()*(e.area[3]-e.area[1]); e.timer=150+Math.random()*100; }
    const tx=e.tx-e.x, ty=e.ty-e.y, td=Math.hypot(tx,ty);
    if(td>3) walk(e,tx/td*.45,ty/td*.45);
    if(d<72){ e.state='chase'; e.alertT=40; SFX.alert(); }
  } else {
    if(d>140){ e.state='patrol'; e.tx=0; return; }
    if(e.type==='tirador'){
      if(d<55) walk(e,-dx/d*.5,-dy/d*.5); else if(d>85) walk(e,dx/d*.5,dy/d*.5);
      if(Math.abs(dx)>Math.abs(dy)) e.dir=dx>0?'right':'left'; else e.dir=dy>0?'down':'up';
      if(e.cd<=0&&d<130){ e.cd=130; SFX.shoot(); bullets.push({x:e.x,y:e.y,vx:dx/d*1.7,vy:dy/d*1.7,from:'e',dmg:1,life:140}); }
    } else if(e.type==='guardia'){
      if(e.turnT>0) e.turnT--; else { e.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'); e.turnT=34; }
      walk(e,dx/d*.6,dy/d*.6,true);
      if(d<12) hurtPlayer(e);
    } else {
      walk(e,dx/d*.75,dy/d*.75);
      if(d<11) hurtPlayer(e);
    }
  }
}
function updBoss(b){
  if(b.hurtT>0) b.hurtT--; if(!b.active) return;
  if(b.stun>0){ b.stun--; b.moving=false; return; }
  b.t++; b.moving=false;
  const dx=P.x-b.x, dy=P.y-b.y, d=Math.hypot(dx,dy)||1, cor=b.kind==='coronel', fast=b.hp<=b.maxhp/2;
  if(b.st!=='charge'){ if(Math.abs(dx)>Math.abs(dy)) b.dir=dx>0?'right':'left'; else b.dir=dy>0?'down':'up'; }
  if(d<16) hurtPlayer(b);
  switch(b.st){
    case 'idle':
      b.timer--; b.moving=true; b.anim++; moveEnt(b,dx/d*.35,dy/d*.35,9,9);
      if(b.timer<=0){
        if(Math.random()<(cor?.3:.5)){ b.st='tele'; b.timer=fast?30:42; SFX.alert(); }
        else { b.st='volley'; b.timer=0; b.volleys=(cor?3:2)+(fast?1:0); }
      }
      break;
    case 'tele':
      b.timer--; if(b.timer<=0){ b.st='charge'; b.timer=48; b.vx=dx/d*(fast?3:2.5); b.vy=dy/d*(fast?3:2.5); }
      break;
    case 'charge':
      b.timer--; b.moving=true; b.anim+=2; moveEnt(b,b.vx,b.vy,9,9);
      if(b.blocked||b.timer<=0){ b.st='recover'; b.timer=fast?40:60; burst(b.x,b.y,'#c9a46a',8); }
      break;
    case 'volley':
      if(b.timer<=0){
        b.volleys--; SFX.shoot(); const base=Math.atan2(dy,dx), n=cor?1:2;
        for(let k=-n;k<=n;k++){ const a=base+k*.28; bullets.push({x:b.x,y:b.y,vx:Math.cos(a)*1.7,vy:Math.sin(a)*1.7,from:'e',dmg:1,life:200}); }
        b.timer=34;
        if(b.volleys<=0){ b.st='recover'; b.timer=fast?30:50; }
      } else b.timer--;
      break;
    case 'call':
      b.timer--;
      if(b.timer===25){
        toast(cor?'¡GUARDIAS!':'¡RURALES!'); SFX.alert();
        (cor?[['b2g1','guardia'],['b2g2','guardia']]:[['bossr1','rural'],['bossr2','rural']]).forEach((q,k)=>{ if(!G.killed.has(q[0])) enemies.push(makeEnemy({id:q[0],type:q[1],x:k?216:40,y:96,area:[24,40,232,184]})); });
      }
      if(b.timer<=0){ b.st='recover'; b.timer=20; }
      break;
    case 'recover':
      b.timer--; if(b.timer<=0){ b.st='idle'; b.timer=fast?35:60; }
      break;
  }
  b.x=clamp(b.x,12,W-12); b.y=clamp(b.y,14,PH-14);
}
function updBullets(){
  bullets=bullets.filter(b=>{
    b.x+=b.vx; b.y+=b.vy; b.life--;
    if(b.life<=0||b.x<0||b.x>W||b.y<0||b.y>PH) return false;
    if(solid(b.x,b.y)){ burst(b.x,b.y,'#c9a46a',3); return false; }
    if(b.from==='e'){ if(Math.abs(b.x-P.x)<6&&Math.abs(b.y-P.y)<7){ hurtPlayer(b); return false; } }
    else{
      for(const e of enemies){ if(e.type==='boss'&&!e.active) continue; if(Math.abs(e.x-b.x)<(e.type==='boss'?11:7)&&Math.abs(e.y-b.y)<(e.type==='boss'?11:7)){ if(damageEnemy(e,b.dmg,b.vx,b.vy)) return false; } }
    }
    return true;
  });
}
function updPickups(){
  pickups=pickups.filter(p=>{
    if(Math.hypot(p.x-P.x,p.y-P.y)>11) return true;
    if(p.type==='heart'){ if(P.hp>=P.maxhp) return true; P.hp++; SFX.pick(); }

      G.pages++; SFX.pick(); const perk=G.pages%2===0; if(perk){ P.maxhp++; P.hp=P.maxhp; }

}
function recruit(id){
  const d=NPCDEF[id];
  G.joined.add(id); G.recruited++; P.copies=Math.max(0,P.copies-1);
  const a=makeAlly(id); a.x=d.tx*T+8; a.y=d.ty*T+8; G.allies.push(a);
  npcs=npcs.filter(n=>n.id!==id);
  if(d.ammo) P.ammo+=d.ammo;
  if(id==='chuy'&&P.hp<P.maxhp) P.hp++;

  if(G.recruited>=3&&!G.gateOpen){ G.gateOpen=true; startDialog([['','A lo lejos, el portón del cuartel cruje. Entre muchos, por fin cede.']]); }
  saveGame();
}
function interact(){
  let best=null,bd=28;
  for(const n of npcs){ const d=Math.hypot(n.x-P.x,n.y-P.y); if(d<bd){ bd=d; best=n; } }
  if(best){ NPCDEF[best.id].talk(); return; }
  let sh=null,sd=26;
  for(const e of enemies){ if(e.shaken){ const d=Math.hypot(e.x-P.x,e.y-P.y); if(d<sd){ sd=d; sh=e; } } }
  if(sh){ if(P.copies>0) convince(sh); else { toast('NECESITAS UN EJEMPLAR'); SFX.click(); } return; }
  for(const q of PRESS){
    if(Math.hypot(q.x-P.x,q.y-P.y)<28){
      if(P.copies>=5){ toast('YA LLEVAS TODOS LOS EJEMPLARES'); return; }
      P.copies=5; SFX.pick(); toast('TOMASTE REGENERACIÓN (5/5)'); saveGame(); return;
    }
  }
  if(G.scr===1&&!G.gateOpen&&Math.hypot(248-P.x,104-P.y)<36){
    startDialog([['','El portón del cuartel está atrancado por dentro. Hace falta mucha gente empujando juntos. (Compañeros: '+G.recruited+'/3)']]);
  } else if(G.scr===5&&!G.gate2Open&&Math.hypot(248-P.x,104-P.y)<36){
    startDialog([['','Una barricada de carretas bloquea la calle. Si dos soldados se pasan de nuestro lado, la quitarán. (Convencidos: '+Math.min(2,G.des2)+'/2)']]);
  }
}
function checkExit(){
  const ex=SCREENS[G.scr].exits; let ns=-1,pos=null;
  if(P.x>W-1&&ex.right!==undefined){ ns=ex.right; pos=[10,P.y]; }
  else if(P.x<1&&ex.left!==undefined){ ns=ex.left; pos=[W-10,P.y]; }
  else if(P.y<1&&ex.up!==undefined){ ns=ex.up; pos=[P.x,PH-10]; }
  else if(P.y>PH-1&&ex.down!==undefined){ ns=ex.down; pos=[P.x,10]; }

  if(ex.left===undefined&&P.x<4) P.x=4; if(ex.right===undefined&&P.x>W-4) P.x=W-4;
  if(ex.up===undefined&&P.y<4) P.y=4; if(ex.down===undefined&&P.y>PH-4) P.y=PH-4;
}

  const x=tx*T,y=ty*T;
  switch(c){
    case 'w': {
      const a=(MAP[ty-1]||'')[tx];
      ctx.fillStyle='#34607b'; ctx.fillRect(x,y,T,T); ctx.fillStyle='#2b5069'; ctx.fillRect(x,y+8,T,4);
      ctx.fillStyle='#6f9bb5'; ctx.fillRect(x+(Math.floor(G.t/9)+tx*5)%14,y+5,4,1); ctx.fillRect(x+(Math.floor(G.t/13)+tx*3+7)%14,y+11,3,1);
      if(((G.t>>3)+tx*3+ty)%9===0){ ctx.fillStyle='#e8f4ff'; ctx.fillRect(x+4+(tx*7)%8,y+7,1,1); }
      if(a!=='w'){
        ctx.fillStyle='#7a6a48'; ctx.fillRect(x,y,T,4); ctx.fillStyle='#5a4c30'; ctx.fillRect(x,y+3,T,1);
        for(let k=0;k<2;k++){ const rx=x+2+((tx*5+k*7)%12), sw=Math.round(Math.sin(G.t/18+rx)); ctx.fillStyle='#4a6b3a'; ctx.fillRect(rx+sw,y-3,1,6); ctx.fillRect(rx,y-1,1,3); ctx.fillStyle='#8a5a2a'; ctx.fillRect(rx+sw,y-4,1,2); }
      }
      break; }
    case 'F': {
      ctx.fillStyle='rgba(0,0,0,.28)'; ctx.fillRect(x+1,y+11,14,4);
      for(let k=0;k<8;k++){ const an=k/8*6.28; ctx.fillStyle=k%2?'#7a7a7a':'#9a9a9a'; ctx.fillRect(x+7+Math.round(Math.cos(an)*6),y+10+Math.round(Math.sin(an)*3),3,2); }
      ctx.fillStyle='#4a2e18'; ctx.fillRect(x+3,y+9,10,2); ctx.fillStyle='#6a4426'; ctx.fillRect(x+4,y+8,8,2);
      const h=6+Math.floor(Math.sin(G.t/3)*1.5+Math.sin(G.t/5));
      ctx.fillStyle='#d9381e'; ctx.fillRect(x+4,y+9-h,8,h); ctx.fillStyle='#f27a22'; ctx.fillRect(x+5,y+9-h+2,6,h-2); ctx.fillStyle='#ffc247'; ctx.fillRect(x+6,y+9-h+4,4,h-4); ctx.fillStyle='#fff3b0'; ctx.fillRect(x+7,y+7,2,2);
      break; }
    case 'b':
      ctx.fillStyle='rgba(0,0,0,.25)'; ctx.fillRect(x+1,y+13,7,3); ctx.fillStyle='#4a3320'; ctx.fillRect(x+3,y-4,2,19); ctx.fillStyle='#e0b84a'; ctx.fillRect(x+2,y-6,4,3);
      flag(x+5,y-3,13,9);
      break;
    case 'X':
      if(gateOpenHere()) break;
      if(G.scr===5){
        ctx.fillStyle='rgba(0,0,0,.28)'; ctx.fillRect(x,y+13,T,3);
        ctx.fillStyle='#6b4a2a'; ctx.fillRect(x+1,y+3,14,11); ctx.fillStyle='#8a6238'; ctx.fillRect(x+1,y+3,14,3); ctx.fillStyle='#3a2a1a'; ctx.fillRect(x+1,y+8,14,1);
        ctx.strokeStyle='#2a1c14'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(x+8,y+9,5,0,6.29); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x+3,y+9); ctx.lineTo(x+13,y+9); ctx.moveTo(x+8,y+4); ctx.lineTo(x+8,y+14); ctx.stroke();
        ctx.fillStyle='#c9b48a'; ctx.fillRect(x+1,y+1,5,3); ctx.fillRect(x+10,y+1,5,3); ctx.fillStyle='#8a7a5a'; ctx.fillRect(x+1,y+3,5,1); ctx.fillRect(x+10,y+3,5,1);
        break;
      }
      ctx.fillStyle='#5a3a20'; ctx.fillRect(x,y,T,T); ctx.fillStyle='#43290f'; ctx.fillRect(x+3,y,1,T); ctx.fillRect(x+7,y,1,T); ctx.fillRect(x+11,y,1,T);
      ctx.fillStyle='#2a2a2a'; ctx.fillRect(x,y+2,T,3); ctx.fillRect(x,y+11,T,3);
      ctx.fillStyle='#8a8a8a'; for(let k=2;k<T;k+=4){ ctx.fillRect(x+k,y+3,1,1); ctx.fillRect(x+k,y+12,1,1); }
      if(ty===6){ ctx.fillStyle='#e0b84a'; ctx.fillRect(x+4,y+6,6,6); ctx.fillStyle='#1a1410'; ctx.fillRect(x+6,y+8,2,3); }
      ctx.fillStyle='rgba(0,0,0,.3)'; ctx.fillRect(x,y,2,T);
      break;
  }
}

/* ---------- personajes ---------- */
function drawHead(o,dir,M){
  const C=c=>M||c;
  ctx.fillStyle=C(o.skin); ctx.fillRect(-3,-6,6,5);
  if(dir==='up'){ ctx.fillStyle=C(o.hair||'#1a1210'); ctx.fillRect(-3,-6,6,5); }
  else {
    if(!M){ ctx.fillStyle='rgba(0,0,0,.12)'; ctx.fillRect(1,-6,2,5); }
    ctx.fillStyle=M||'#1a1210';
    if(dir==='down'){ ctx.fillRect(-2,-4,1,1); ctx.fillRect(1,-4,1,1); } else if(dir==='left') ctx.fillRect(-2,-4,1,1); else ctx.fillRect(1,-4,1,1);
    if(!M&&dir==='down'){ ctx.fillStyle='rgba(120,40,30,.55)'; ctx.fillRect(-1,-2,2,1); }
    if(o.mustache){ ctx.fillStyle=C(o.mustache); if(dir==='down') ctx.fillRect(-2,-2,4,1); else if(dir==='left') ctx.fillRect(-3,-2,3,1); else ctx.fillRect(0,-2,3,1); }
  }
  if(o.longhair){ ctx.fillStyle=C(o.hair); ctx.fillRect(-4,-6,1,7); ctx.fillRect(3,-6,1,7); }
  const hc=C(o.hat);
  if(o.style==='kepi'){
    ctx.fillStyle=hc; ctx.fillRect(-4,-10,8,4); ctx.fillRect(-4,-7,8,1);
    if(!M){ ctx.fillStyle=o.band; ctx.fillRect(-4,-8,8,1); if(dir==='down'){ ctx.fillStyle='#fff3b0'; ctx.fillRect(-1,-9,2,1); } ctx.fillStyle='rgba(255,255,255,.14)'; ctx.fillRect(-4,-10,8,1); }
  } else if(o.style==='wrap'){
    ctx.fillStyle=hc; ctx.fillRect(-4,-9,8,4); ctx.fillRect(-4,-5,1,3); if(!M){ ctx.fillStyle='rgba(255,255,255,.15)'; ctx.fillRect(-3,-9,6,1); ctx.fillStyle='rgba(0,0,0,.2)'; ctx.fillRect(-4,-6,8,1); }
  } else if(o.style==='cap'){
    ctx.fillStyle=hc; ctx.fillRect(-4,-9,8,3);
    if(dir==='left') ctx.fillRect(-6,-7,3,1); else if(dir==='right') ctx.fillRect(3,-7,3,1); else ctx.fillRect(-4,-7,8,1);
    if(!M){ ctx.fillStyle='rgba(255,255,255,.16)'; ctx.fillRect(-3,-9,6,1); ctx.fillStyle='rgba(0,0,0,.25)'; ctx.fillRect(-3,-6,6,1); }
  } else if(o.style==='bare'){
    ctx.fillStyle=C(o.hair); ctx.fillRect(-3,-8,6,3); ctx.fillRect(-4,-6,1,3); ctx.fillRect(3,-6,1,3);
  } else if(o.style==='sombrero'){
    ctx.fillStyle=hc; ctx.fillRect(-6,-8,12,2); ctx.fillRect(-3,-11,6,3);
  }
}
function body(o,dir,moving,st,M,outline){
  const C=c=>M||c, lo=moving?(st?1:0):0, ro=moving?(st?0:1):0;
  ctx.fillStyle=C(o.pants); ctx.fillRect(-3,5+lo,3,3-lo); ctx.fillRect(0,5+ro,3,3-ro);
  if(!outline){ ctx.fillStyle='#1d1612'; ctx.fillRect(-3,7,3,1); ctx.fillRect(0,7,3,1); }
  ctx.fillStyle=C(o.shirt); ctx.fillRect(-4,-1,8,6); ctx.fillRect(-5,0,1,4); ctx.fillRect(4,0,1,4);
  if(o.scarf){ ctx.fillStyle=C(o.scarf); ctx.fillRect(-3,-1,6,2); }
  if(!outline){
    ctx.fillStyle='rgba(0,0,0,.18)'; ctx.fillRect(1,-1,3,6); ctx.fillRect(4,0,1,4);
    ctx.fillStyle='rgba(255,255,255,.14)'; ctx.fillRect(-4,0,2,1);
    ctx.fillStyle='#3a2a1a'; ctx.fillRect(-4,3,8,1); ctx.fillStyle='#d8b44a'; ctx.fillRect(0,3,2,1);
    ctx.fillStyle=o.skin; ctx.fillRect(-5,4,1,1); ctx.fillRect(4,4,1,1);
    if(o.tail){ const sw=Math.round(Math.sin(G.t/5)); ctx.fillStyle=o.scarf; if(dir==='left') ctx.fillRect(3,-1+sw,3,1); else if(dir==='right') ctx.fillRect(-6,-1+sw,3,1); else if(dir==='up'){ ctx.fillRect(-1,0,2,3); ctx.fillRect(sw,3,1,1); } }
    if(o.bandolier){ ctx.fillStyle='#3a2a1a'; for(let i=0;i<7;i++) ctx.fillRect(-4+i,-1+i*.7|0,1,1); ctx.fillStyle='#c9a24a'; ctx.fillRect(-2,0,1,1); ctx.fillRect(0,2,1,1); }
    switch(o.extra){
      case 'apron': ctx.fillStyle='#f0eadc'; ctx.fillRect(-3,1,6,5); ctx.fillStyle='#d8d0bc'; ctx.fillRect(-3,5,6,1); break;
      case 'shovel': ctx.fillStyle='#6b4423'; ctx.fillRect(5,-5,1,12); ctx.fillStyle='#9aa0a6'; ctx.fillRect(4,6,3,3); break;
      case 'tie': if(dir==='down'){ ctx.fillStyle='#8a2a2a'; ctx.fillRect(0,-1,1,4); } break;
      case 'pin': ctx.fillStyle='#c8312b'; ctx.fillRect(1,0,1,1); break;
      case 'book': ctx.fillStyle='#8a2a2a'; ctx.fillRect(dir==='right'?-6:4,2,3,4); ctx.fillStyle='#f2ead3'; ctx.fillRect(dir==='right'?-5:5,2,1,3); break;
      case 'cane': ctx.fillStyle='#6b4423'; ctx.fillRect(5,3,1,5); ctx.fillRect(4,2,2,1); break;
      case 'satchel': if(dir!=='up'){ ctx.fillStyle='#7a5a3a'; ctx.fillRect(dir==='right'?-6:4,2,3,4); ctx.fillStyle='#f2ead3'; ctx.fillRect(dir==='right'?-5:5,1,1,2); } ctx.fillStyle='#5a4028'; for(let i=0;i<5;i++) ctx.fillRect(-3+i,-1+i,1,1); break;
      case 'medals': ctx.fillStyle='#e0b84a'; ctx.fillRect(-5,-1,2,1); ctx.fillRect(3,-1,2,1); ctx.fillRect(-2,1,1,1); ctx.fillStyle='#c8312b'; ctx.fillRect(1,1,1,1); ctx.fillStyle='#e0b84a'; ctx.fillRect(2,2,1,1); break;
    }
  }
  drawHead(o,dir,M);
}
function person(x,y,dir,o,anim,moving,flash,scale){
  ctx.save(); ctx.translate(Math.round(x),Math.round(y)); const s=scale||1; if(s!==1) ctx.scale(s,s);
  ctx.fillStyle='rgba(0,0,0,.28)'; ctx.fillRect(-6,7,12,2); ctx.fillRect(-5,6,10,1); ctx.fillRect(-5,9,10,1);
  const st=Math.floor(anim/7)%2;
  [[-1,0],[1,0],[0,-1],[0,1]].forEach(d=>{ ctx.save(); ctx.translate(d[0],d[1]); body(o,dir,moving,st,'#1a1210',true); ctx.restore(); });
  body(o,dir,moving,st,flash?'#fff':null,false);
  ctx.restore();
}
function colFor(who){
  if(who==='Inés') return COL.player; if(who==='Jefe Político') return COL.boss; if(who==='Coronel Federal') return COL.coronel;
  for(const id in NPCDEF) if(NPCDEF[id].name===who) return NPCDEF[id].col;
  return null;
}
function bubble(x,y){ ctx.fillStyle='#1a1210'; ctx.fillRect(x-7,y-4,14,10); ctx.fillStyle='#fff'; ctx.fillRect(x-6,y-3,12,8); ctx.fillRect(x-1,y+5,2,2); ctx.fillStyle='#2a1c16'; ctx.fillRect(x-4,y,2,2); ctx.fillRect(x-1,y,2,2); ctx.fillRect(x+2,y,2,2); }
function drawNpc(n){
  const d=NPCDEF[n.id], dist=Math.hypot(n.x-P.x,n.y-P.y);
  let dir='down'; if(dist<60){ const dx=P.x-n.x,dy=P.y-n.y; dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'); }
  person(n.x,n.y+Math.round(Math.sin(G.t/30+n.x)*.6),dir,d.col,0,false,false,n.id==='nacho'?.92:1);
  if(dist<30) bubble(n.x,n.y-21);
}
function drawAlly(a){ person(a.x,a.y,a.dir,a.col,a.anim,a.moving,false,1); }
function drawShield(x,y,dir,sc){
  ctx.save(); ctx.translate(Math.round(x),Math.round(y)); ctx.scale(sc,sc);
  let rx,ry,rw,rh;
  if(dir==='left'){ rx=-10; ry=-3; rw=4; rh=11; } else if(dir==='right'){ rx=6; ry=-3; rw=4; rh=11; } else if(dir==='down'){ rx=-5; ry=4; rw=10; rh=5; } else { rx=-5; ry=-9; rw=10; rh=4; }
  ctx.fillStyle='#1a1210'; ctx.fillRect(rx-1,ry-1,rw+2,rh+2); ctx.fillStyle='#8f97a2'; ctx.fillRect(rx,ry,rw,rh);
  ctx.fillStyle='#c9d0d8'; ctx.fillRect(rx,ry,rw,1); ctx.fillStyle='#c9a24a'; ctx.fillRect(rx+Math.floor(rw/2)-1,ry+Math.floor(rh/2)-1,2,2);
  ctx.restore();
}
function stars(x,y){ for(let i=0;i<3;i++){ const a=G.t/6+i*2.1; ctx.fillStyle='#ffd84a'; ctx.fillRect(Math.round(x+Math.cos(a)*6),Math.round(y+Math.sin(a)*2),2,2); } }
function drawEnemy(e){
  const flash=e.hurtT>0&&Math.floor(G.t/2)%2===0;
  if(e.type==='boss'){
    const cor=e.kind==='coronel', tele=e.st==='tele'&&Math.floor(G.t/3)%2===0;
    person(e.x,e.y,e.dir,cor?COL.coronel:COL.boss,e.anim,e.moving,flash||tele,1.7);
    if(cor&&e.stun<=0&&(e.st==='idle'||e.st==='volley'||e.st==='tele')) drawShield(e.x,e.y,e.dir,1.7);
    if(e.st==='tele') text('!',e.x,e.y-30,'#ff3a2a','center',16);
    if(e.stun>0) stars(e.x,e.y-26);
    return;
  }
  const o=e.type==='tirador'?COL.tirador:(e.type==='guardia'?COL.guardia:COL.rural);
  person(e.x,e.y,e.dir,o,e.anim,e.moving,flash,1);
  const v=DIRV[e.dir], armed=!e.shaken&&e.state!=='flee';
  if(armed&&e.type!=='guardia'){
    if(e.dir==='left'||e.dir==='right'){ ctx.fillStyle='#5a3a22'; ctx.fillRect(e.x+v[0]*3-(v[0]<0?5:0),e.y+1,6,2); ctx.fillStyle='#555'; ctx.fillRect(e.x+v[0]*8-(v[0]<0?2:0),e.y+1,3,1); }
    else if(e.type==='tirador'){ ctx.fillStyle='#222'; ctx.fillRect(e.x+(v[1]>0?3:-4),e.y-2,1,8); }
  }
  if(e.type==='guardia'&&armed) drawShield(e.x,e.y,e.dir,1);
  if(e.shaken){
    ctx.fillStyle='#1a1210'; ctx.fillRect(e.x+3,e.y-15,1,10); ctx.fillStyle='#f2ead3'; ctx.fillRect(e.x+4,e.y-15,5,4);
    if(P.copies>0&&Math.hypot(e.x-P.x,e.y-P.y)<34) bubble(e.x,e.y-26);
  }
  if(e.stun>0) stars(e.x,e.y-14);
  if(e.alertT>0) text('!',e.x,e.y-14,'#ff3a2a','center',8);
}
function drawPlayer(){
  if(P.inv>0&&Math.floor(G.t/3)%2===0) return;
  person(P.x,P.y,P.dir,COL.player,P.anim,P.moving,false,1);
  if(P.hasMachete&&P.atkT<=0){ const v=DIRV[P.dir]; if(P.dir==='left'||P.dir==='right'){ ctx.fillStyle='#d8dde2'; ctx.fillRect(P.x-(v[0]>0?6:-3)-(v[0]>0?0:1),P.y+3,3,1); } }
  if(P.atkT>0){
    const p=(14-P.atkT)/14, a0=DIRA[P.dir]-.9, a=a0+1.8*p, cx=Math.cos(a), cy=Math.sin(a);
    ctx.lineCap='butt'; ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(P.x,P.y+1,15,a0,a); ctx.stroke();
    ctx.lineWidth=2; ctx.strokeStyle='#6b4423'; ctx.beginPath(); ctx.moveTo(P.x,P.y+1); ctx.lineTo(P.x+cx*5,P.y+1+cy*5); ctx.stroke();
    ctx.strokeStyle='#e8edf2'; ctx.beginPath(); ctx.moveTo(P.x+cx*5,P.y+1+cy*5); ctx.lineTo(P.x+cx*17,P.y+1+cy*17); ctx.stroke();
  }
}
function drawPickup(p){
  const b=Math.round(Math.sin(G.t/10+p.x)*1.5), x=Math.round(p.x), y=Math.round(p.y+b);
  ctx.fillStyle='rgba(0,0,0,.25)'; ctx.fillRect(x-4,p.y+5,8,2);
  if(Math.floor(G.t/14+p.x)%3===0){ ctx.fillStyle='rgba(255,255,230,.9)'; ctx.fillRect(x+4,y-5,1,3); ctx.fillRect(x+3,y-4,3,1); }
  if(p.type==='heart') heartOut(x-3,y-3,true);
  else if(p.type==='ammo'){ ctx.fillStyle='#1a1210'; ctx.fillRect(x-5,y-4,10,8); ctx.fillStyle='#8a6a1b'; ctx.fillRect(x-4,y-3,8,6); ctx.fillStyle='#d8b43a'; ctx.fillRect(x-3,y-4,2,3); ctx.fillRect(x,y-4,2,3); ctx.fillRect(x+2,y-4,1,3); }
  else { ctx.fillStyle='#1a1210'; ctx.fillRect(x-8,y-2,16,5); ctx.fillStyle='#4a3320'; ctx.fillRect(x-7,y-1,14,3); ctx.fillStyle='#222'; ctx.fillRect(x-1,y-2,6,2); ctx.fillStyle='#8a6a3a'; ctx.fillRect(x-7,y,5,3); ctx.fillStyle='#aaa'; ctx.fillRect(x+4,y-1,3,1); }
}

/* ---------- escena ---------- */
function lighting(){
  const t0=THEME[THEME_OF[G.scr]];
  ctx.globalCompositeOperation='multiply'; ctx.fillStyle=TINT_OVR[G.scr]||t0.tint; ctx.fillRect(0,0,W,PH);
  ctx.globalCompositeOperation='lighter';
  LIGHTS[G.scr].forEach((l,i)=>{
    const fl=1+Math.sin(G.t/6+i*2)*.05+Math.sin(G.t/3.1+i)*.03, r=l.r*fl;
    const g=ctx.createRadialGradient(l.x,l.y,1,l.x,l.y,r);
    g.addColorStop(0,'rgba('+l.c+',.42)'); g.addColorStop(.5,'rgba('+l.c+',.14)'); g.addColorStop(1,'rgba('+l.c+',0)');
    ctx.fillStyle=g; ctx.fillRect(l.x-r,l.y-r,r*2,r*2);
  });
  ctx.globalCompositeOperation='source-over';
  const v=ctx.createRadialGradient(128,104,66,128,104,178); v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,'+t0.vig+')');
  ctx.fillStyle=v; ctx.fillRect(0,0,W,PH);
}
function drawWorld(){
  if(!BG) buildBG();

  ctx.drawImage(BG,0,0);
  ANIM.forEach(a=>animTile(a[0],a[1],a[2]));
  pickups.forEach(drawPickup);
  PRESS.forEach(q=>{ if(Math.hypot(q.x-P.x,q.y-P.y)<30) bubble(q.x,q.y-20); });
  const list=[]; npcs.forEach(n=>list.push([n.y,()=>drawNpc(n)])); G.allies.forEach(a=>list.push([a.y,()=>drawAlly(a)])); enemies.forEach(e=>list.push([e.y,()=>drawEnemy(e)])); list.push([P.y,drawPlayer]);
  list.sort((a,b)=>a[0]-b[0]).forEach(l=>l[1]());

    const col=b.from==='e'?'#ff6a3a':'#fbe39a';
    ctx.strokeStyle=b.from==='e'?'rgba(255,106,58,.45)':'rgba(251,227,154,.5)'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(b.x,b.y); ctx.lineTo(b.x-b.vx*3,b.y-b.vy*3); ctx.stroke();
    ctx.fillStyle=col; ctx.fillRect(Math.round(b.x)-1,Math.round(b.y)-1,3,3);
  });
  parts.forEach(p=>{ ctx.globalAlpha=p.fade?Math.min(1,p.life/12):1; ctx.fillStyle=p.col; const s=p.sz||2; ctx.fillRect(Math.round(p.x),Math.round(p.y),s,s); });

  AMB.forEach(a=>{ ctx.fillStyle=G.scr===3?'rgba(255,220,150,.5)':'rgba(255,255,255,.55)'; ctx.fillRect(Math.round(a.x),Math.round(a.y),a.s,a.s); });
  lighting();
  ctx.restore();
  ctx.save(); ctx.translate(0,HUD);
  if(boss&&boss.active){
    text(boss.kind==='coronel'?'CORONEL FEDERAL':'JEFE POLÍTICO',128,10,'#f2ead3','center'); ctx.fillStyle='#000'; ctx.fillRect(63,14,130,9); ctx.fillStyle='#c9a24a'; ctx.fillRect(64,15,128,7); ctx.fillStyle='#2a0e0e'; ctx.fillRect(65,16,126,5);
